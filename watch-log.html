:root {

}

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f; --surface: #1f1d18; --ink: #ece6d9; --muted: #a49c8b; --line: #36322a;

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;

.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1 { font-weight: 700; font-size: 28px; margin: 0; letter-spacing: .04em; display: flex; align-items: baseline; gap: 12px; }
h1 .en { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .2em; color: var(--band-ink); background: var(--accent); padding: 2px 8px; border-radius: 3px; }
.sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
#q { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: inherit; }
.month { display: flex; flex-direction: column; gap: 12px; }
.month h2 { font-weight: 700; font-size: 18px; margin: 8px 0 0; display: flex; align-items: baseline; gap: 10px; }
.month h2 .en { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .06em; color: var(--accent); }
.month h2 small { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; }
.ticket { display: grid; grid-template-columns: minmax(0, 1fr) 64px; color: var(--paper-ink); }
.ticket:hover .body, .ticket:hover .stub { background: var(--paper-hi); }
.ticket .body, .ticket .stub { background: var(--paper); min-width: 0; }
.ticket .body { display: grid; grid-template-columns: 76px minmax(0, 1fr) minmax(0, 170px) 84px 70px; align-items: center; column-gap: 14px; border-radius: 4px 0 0 4px; overflow: hidden; min-height: 44px; }
.tag { align-self: stretch; background: var(--kc); color: var(--band-ink); font-family: var(--f-display); font-weight: 600; font-size: 12.5px; letter-spacing: .1em; display: flex; align-items: center; justify-content: center; }
.ticket .main { min-width: 0; padding-block: 7px; }
.ticket .t { font-weight: 700; font-size: 14.5px; line-height: 1.4; display: flex; align-items: center; min-width: 0; }
.ticket .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ticket .place { font-size: 12.5px; color: var(--paper-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket .when { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ticket .rate { font-size: 12px; white-space: nowrap; }
.ticket .stub { position: relative; border-left: 2px dashed var(--perf); border-radius: 0 4px 4px 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 11px; color: var(--paper-muted); letter-spacing: .04em; }
.ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; left: -7px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
.ticket .stub::before { top: -6px; }
.ticket .stub::after { bottom: -6px; }
.marks { flex: none; display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 1px; }
.lnk { font-size: 11.5px; color: var(--kc); font-weight: 700; text-decoration: none; }
.lnk:hover { text-decoration: underline; }
.none { color: var(--paper-muted); }
.meta-sm { display: none; }
@media (max-width: 600px) {
  .ticket { grid-template-columns: minmax(0, 1fr) 50px; }
  .ticket .body { grid-template-columns: 54px minmax(0, 1fr); column-gap: 12px; }
  .ticket .place, .ticket .when, .ticket .rate { display: none; }
  .meta-sm { display: block; font-size: 11.5px; color: var(--paper-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-sm .num { font-family: var(--f-mono); }
  .tag { font-size: 10.5px; letter-spacing: .06em; }
  .ticket .stub { font-size: 10px; }

.stars { color: var(--kc); letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
.ref { background: var(--kc); color: var(--band-ink); font-size: 11px; font-weight: 700; border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
.unv { background: var(--warn-bg); color: var(--warn-ink); font-size: 11px; font-weight: 700; border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 18px; text-align: center; color: var(--muted); }
</style>

  { id: "ドラマ", en: "DRAMA", c: "--k-drama" }, { id: "ライブ", en: "LIVE", c: "--k-live" },
  { id: "音楽", en: "MUSIC", c: "--k-music" }, { id: "MV", en: "MV", c: "--k-mv" },
  { id: "ドキュメンタリー", en: "DOC", c: "--k-doc" }, { id: "本・マンガ", en: "BOOK", c: "--k-book" },
  { id: "イラスト", en: "ILLUST", c: "--k-illust" }, { id: "その他", en: "OTHER", c: "--k-other" },
];
const kindOf = k => KINDS.find(x => x.id === k) || KINDS[KINDS.length - 1];
const kindColor = k => `var(${kindOf(k).c})`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const stars = n => n ? "★".repeat(n) + "☆".repeat(5 - n) : "";
const entries = [...ENTRIES].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
const serials = new Map([...ENTRIES].sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "")).map((e, i) => [e.id, i + 1]));
let filter = "すべて";

function renderStats() {
  const latest = (entries[0]?.date || "").slice(0, 7);
  const refs = entries.filter(e => e.ref).length, unv = entries.filter(e => !e.verified).length;
  $("stats").innerHTML = `<span>全部で <b>${entries.length}</b> 件</span>` + (latest ? `<span>${esc(latest)} <b>${entries.filter(e => (e.date || "").startsWith(latest)).length}</b> 件</span>` : "") +
    (refs ? `<span>仕事の参考 <b>${refs}</b> 件</span>` : "") + (unv ? `<span>名前の確認待ち <b>${unv}</b> 件</span>` : "");
}
function renderFilters() {
  const counts = {};
  entries.forEach(e => counts[e.kind] = (counts[e.kind] || 0) + 1);
  const items = [{ id: "すべて" }, ...KINDS.filter(k => counts[k.id])];
  $("filters").innerHTML = items.map(k => `<button type="button" class="chip" data-k="${esc(k.id)}" aria-pressed="${filter === k.id}">${k.c ? `<span class="dot" style="background:${kindColor(k.id)}"></span>` : ""}${esc(k.id)}${k.c ? ` <span style="opacity:.6">${counts[k.id]}</span>` : ""}</button>`).join("");
}
function rowHTML(e) {
  const no = String(serials.get(e.id) || 0).padStart(4, "0");
  const date = (e.date || "").replaceAll("-", ".");
  const link = safeUrl(e.link);
  const rate = e.rating ? `<span class="stars" aria-label="評価${e.rating}">${stars(e.rating)}</span>` : `<span class="none">—</span>`;
  const marks = (link ? `<a class="lnk" href="${esc(link)}" target="_blank" rel="noopener">↗</a>` : "") + (e.ref ? `<span class="ref">参考</span>` : "") + (e.verified ? "" : `<span class="unv">名前 未確認</span>`);
  const sm = [e.place ? esc(e.place) : "", date ? `<span class="num">${esc(date)}</span>` : "", e.rating ? `<span class="stars">${stars(e.rating)}</span>` : ""].filter(Boolean).join(" · ");
  return `<div class="ticket" style="--kc:${kindColor(e.kind)}">
    <div class="body">
      <span class="tag" title="${esc(e.kind)}">${esc(kindOf(e.kind).en)}</span>
      <div class="main">
        <div class="t"><span class="tt" title="${esc(e.title)}">${esc(e.title)}</span>${marks ? `<span class="marks">${marks}</span>` : ""}</div>
        ${sm ? `<div class="meta-sm">${sm}</div>` : ""}
      </div>
      <span class="place">${esc(e.place || "")}</span>
      <span class="when">${esc(date)}</span>
      <span class="rate">${rate}</span>
    </div>
    <div class="stub">${no}</div>
  </div>`;
}
function renderFeed() {
  const q = $("q").value.trim().toLowerCase();
  const list = entries.filter(e => (filter === "すべて" || e.kind === filter) &&
    (!q || [e.title, e.place, e.kind, e.ref ? "参考" : ""].some(v => String(v || "").toLowerCase().includes(q))));
  if (!list.length) { $("feed").innerHTML = `<div class="empty">条件に合う記録はありません。</div>`; return; }
  const groups = new Map();
  list.forEach(e => { const m = (e.date || "????-??").slice(0, 7); if (!groups.has(m)) groups.set(m, []); groups.get(m).push(e); });
  $("feed").innerHTML = [...groups].map(([m, es]) => {
    const [y, mo] = m.split("-");
    const l = m.includes("?") ? { big: "日付なし", small: "", en: "UNDATED" } : { big: `${Number(mo)}月`, small: y, en: MON[Number(mo) - 1] || "" };
    return `<section class="month"><h2><span class="en">${l.en}</span>${l.big}<small>${l.small} · ${es.length}枚</small></h2><div class="list">${es.map(rowHTML).join("")}</div></section>`;
  }).join("");
}
$("filters").addEventListener("click", ev => { const b = ev.target.closest("[data-k]"); if (b) { filter = b.dataset.k; renderFilters(); renderFeed(); } });
$("q").addEventListener("input", renderFeed);
renderStats(); renderFilters(); renderFeed();
</script>
</body>
</html>
